name: Sync Moscow Punk Rock League data from MyChamp
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-mychamp.yml"
      - "scripts/sync_mychamp.py"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
concurrency:
  group: mychamp-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh public league data
        run: python scripts/sync_mychamp.py
      - name: Commit refreshed data
        run: |
          if git diff --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Проект для сайта лиг 2026/src/data/mpl-2026-2027.ts"
          git commit -m "Refresh Moscow Punk Rock League data from MyChamp"
          git push
